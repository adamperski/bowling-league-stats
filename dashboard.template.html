  async function askQuestionSample(sample, q, tier, ui){
    ui.log.append(el('div',{class:'ask-q'}, q));
    const out = el('div',{class:'ask-a'}); ui.log.append(out);
    const steps = el('div'), body = el('div',{class:'ask-md'}), status = el('div',{class:'muted',style:'font-size:12px'}, 'Thinking…');
    out.append(steps, body, status);
    askState.turns.push({role:'user', content:q});
    const ctl = new AbortController(); askState.ctl = ctl; ui.onStart && ui.onStart();
    const tools = [{ name:'run_js',
      description:'Runs JavaScript over the league data (variables `seasons` and `helpers`, described in the first message). The code is a function body: `return` a small JSON-serializable value. Gives back that value as JSON, or an error message.',
      inputSchema:{ type:'object', properties:{ code:{ type:'string', description:'JavaScript function body that returns a JSON-serializable value.' } }, required:['code'] },
      execute: async (input)=>{
        const code = String((input && input.code) || '');
        status.textContent = 'Looking things up…';
        const det = el('details',{class:'ask-tool'}, el('summary',{}, 'Looked something up'), el('pre',{}, code));
        steps.append(det);
        if(!code) throw new Error('no code was provided');
        const r = await askRun(code);
        let txt = r.ok ? r.text : 'Error: '+r.error;
        if(txt.length>30000) txt = txt.slice(0,30000)+'\n…(truncated; aggregate more)';
        det.append(el('div',{class:'muted',style:'font-size:12px'}, r.ok ? 'Result: '+(txt.length>300?txt.slice(0,300)+'…':txt) : txt));
        if(!r.ok) throw new Error(r.error);
        return txt;
      } }];
    try{
      const res = await sample([{role:'user', content:askRules()}].concat(askState.turns.slice(-12)),
        { signal:ctl.signal, tools, modelTier:tier,
          onText:({text})=>{ body.innerHTML = askMd(text); status.textContent = ''; } });
      askState.turns.push({role:'assistant', content:res.text});
      status.textContent = res.truncated ? 'The answer was cut short — ask a narrower question or ask it to continue.' : '';
    }catch(e){
      askState.turns.pop();                                   // drop the failed question so the next one starts clean
      if(e && e.text) body.innerHTML = askMd(e.text);
      if(!e || e.code!=='cancelled') status.replaceWith(el('div',{class:'neg'}, askErrCopy(e && e.code)));
      else status.textContent = 'Stopped.';
    }finally{ askState.ctl = null; ui.onEnd && ui.onEnd(); }
  }

      const a = el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(askData())],{type:'application/json'})), download:'league-data.json'});
      document.body.append(a); a.click(); a.remove();
    };
    const open = el('a',{href:'https://claude.ai/new', target:'_blank', rel:'noopener', class:'wkbtn', style:'text-decoration:none'}, 'Open claude.ai');
    fb.append(cp, dl, open); p2.append(fb); v.append(p2);

    // inside the published Claude artifact: ask Claude directly through the viewer's own account
    askSampleP.then(sample=>{
      if(!sample) return;
      sampleFn = sample;
      desc.textContent = descSample; artRow.hidden = true; p2.hidden = true; askRow.hidden = false; log.hidden = false;
    });
  }
  // ================= Trends =================
  function trendChart(weeks, seasonAvg){
    const pts = weeks.filter(w=>w.value>0);
    if(pts.length<1) return el('div',{class:'muted',style:'padding:10px 14px'},'not enough weeks yet');
    const sa = seasonAvg || Math.round(pts.reduce((s,w)=>s+w.value,0)/pts.length);
    const W=680, H=140, pad=8, base=H-16;
    const vals = pts.map(w=>w.value).concat([sa, ...weeks.map(w=>w.toDateAvg).filter(Boolean)]);
    const dMin=Math.min(...vals), dMax=Math.max(...vals), span=(dMax-dMin)||1;
    const floor = dMin - span*0.35, ceil = dMax + span*0.12;      // compressed scale so week-to-week differences read
    const yOf = v => pad + (1-(v-floor)/(ceil-floor))*(base-pad);
    const bw = (W-2*pad)/weeks.length, gap = Math.min(10, bw*0.22);
    let svg='';
    const ay = yOf(sa);
    svg += `<line x1="${pad}" x2="${W-pad}" y1="${ay.toFixed(1)}" y2="${ay.toFixed(1)}" style="stroke:var(--ink)" stroke-dasharray="4 3" opacity="0.45"/>`;
    svg += `<text x="${W-pad}" y="${(ay-4).toFixed(1)}" text-anchor="end" font-size="10" style="fill:var(--muted)">season avg ${num(sa)}</text>`;
    // to-date average line (stepped) = "form"
    const tdPts = weeks.map((w,i)=> w.toDateAvg? `${(pad+(i+0.5)*bw).toFixed(1)},${yOf(w.toDateAvg).toFixed(1)}` : null).filter(Boolean);
    if(tdPts.length>1) svg += `<polyline points="${tdPts.join(' ')}" fill="none" style="stroke:var(--accent)" stroke-width="1.5" opacity="0.75"/>`;
    weeks.forEach((w,i)=>{
      if(!w.value) return;
      const x=pad+i*bw+gap/2, wd=Math.max(2,bw-gap);
      const top=yOf(w.value), h=base-top;
      const above = w.vsSeason==null ? true : w.vsSeason>=0;
      svg += `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${wd.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="2" style="fill:var(--${above?'good':'bad'})" opacity="${w.full?0.9:0.4}"/>`;
      svg += `<text x="${(x+wd/2).toFixed(1)}" y="${(top-3).toFixed(1)}" text-anchor="middle" font-size="9" style="fill:var(--muted)">${num(w.value)}</text>`;
      svg += `<text x="${(x+wd/2).toFixed(1)}" y="${(H-3)}" text-anchor="middle" font-size="9" style="fill:var(--muted)">${w.date.slice(5)}</text>`;
    });
    return el('div',{class:'chartwrap',html:
      `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:${W}px">${svg}</svg>`});
  }

  function trendTable(weeks){
    const hasOpp = weeks.some(w=>w.opp);
    const cols = [{k:'date',label:'Week',fmt:(x,r)=> r.weekNum ? el('span',{}, x+' ', r.isPos? el('span',{class:'ktag',style:'background:var(--accent);color:#fff'},'pos') : el('span',{class:'muted',style:'font-size:11px'},'w'+r.weekNum)) : x}];
    if(hasOpp) cols.push({k:'opp',label:'Opp',cls:'hide-sm'});
    cols.push(
      {k:'value',label:'Series',cls:'num',fmt:(x,r)=> r.full? num(x) : el('span',{class:'muted'}, num(x)+' ('+r.games+'g)')},
      {k:'perGame',label:'/gm',cls:'num hide-sm'},
      {k:'vsToDate',label:'vs form',cls:'num',fmt:d=> d==null?'—': el('span',{class:d>0?'pos':(d<0?'neg':'')}, signed(d))},
      {k:'vsSeason',label:'vs season',cls:'num',fmt:d=> d==null?'—': el('span',{class:d>0?'pos':(d<0?'neg':'')}, signed(d))},
      {k:'rank',label:'Week rank',cls:'num',fmt:(x,r)=> x? x+' / '+r.field : '—'},
    );
    return table(cols, weeks, {sort:'date',dir:1});
  }

  function lineChart(rows, a, b){
    // rows: [{date}], a/b: {key,label,color,dash}  -> two overlaid polylines
    if(rows.length<1) return el('div',{class:'muted',style:'padding:10px 14px'},'not enough weeks yet');
    const W=680,H=140,pad=10,base=H-16;
    const vals = rows.flatMap(r=>[r[a.key], b?r[b.key]:null]).filter(x=>x!=null);
    const lo=Math.min(...vals), hi=Math.max(...vals), rng=(hi-lo)||1;
    const yOf=v=> pad + (1-(v-lo)/rng)*(base-pad);
    const xOf=i=> pad + (rows.length===1? (W-2*pad)/2 : i*(W-2*pad)/(rows.length-1));
    const poly = s => rows.map((r,i)=> r[s.key]==null?null:`${xOf(i).toFixed(1)},${yOf(r[s.key]).toFixed(1)}`).filter(Boolean).join(' ');
    let svg='';
    if(b) svg += `<polyline points="${poly(b)}" fill="none" style="stroke:var(--muted)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>`;
    svg += `<polyline points="${poly(a)}" fill="none" style="stroke:var(--accent)" stroke-width="2"/>`;
    rows.forEach((r,i)=>{
      if(r[a.key]!=null) svg += `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(r[a.key]).toFixed(1)}" r="2.5" style="fill:var(--accent)"/>`;
      svg += `<text x="${xOf(i).toFixed(1)}" y="${H-3}" text-anchor="middle" font-size="9" style="fill:var(--muted)">${r.date.slice(5)}</text>`;
    });
    const last = rows[rows.length-1];
    if(last[a.key]!=null) svg += `<text x="${W-pad}" y="${(yOf(last[a.key])-4).toFixed(1)}" text-anchor="end" font-size="10" style="fill:var(--accent)">${a.label} ${num(Math.round(last[a.key]))}</text>`;
    return el('div',{class:'chartwrap',html:`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:${W}px">${svg}</svg>`});
  }
  function spark(byWeek, key){
    const vals = A(byWeek).map(w=>w[key]).filter(x=>x!=null);
    if(vals.length<2) return el('span',{class:'muted'},'—');
    const W=120,H=26,lo=Math.min(...vals),hi=Math.max(...vals),rng=(hi-lo)||1;
    const pts = A(byWeek).map((w,i)=> w[key]==null?null:`${(2+i*(W-4)/(A(byWeek).length-1)).toFixed(1)},${(2+(1-(w[key]-lo)/rng)*(H-4)).toFixed(1)}`).filter(Boolean).join(' ');
    return el('span',{html:`<svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px;vertical-align:middle"><polyline points="${pts}" fill="none" style="stroke:var(--accent)" stroke-width="1.5"/></svg>`});
  }
  function stat(title, ...body){
    const c = el('div',{class:'card'}); c.append(el('h3',{},title), ...body.flat().filter(Boolean)); return c;
  }
  function kv(pairs){
    const t = el('table',{class:'kv'});
    pairs.forEach(([k,...vs])=>{
      const tr=el('tr'); tr.append(el('td',{},k));
      vs.forEach(vv=>tr.append(el('td',{class:'num'}, vv==null||vv===''? '—' : (vv.nodeType?vv:''+vv))));
      t.append(tr);
    });
    return t;
  }
  function delta(n, unit){ if(n==null) return el('span',{class:'muted'},'—');
    return el('span',{class:n>0?'pos':(n<0?'neg':'muted')}, signed(n)+(unit||'')); }

  function viewTrends(v){
    const fav = D.meta.favoriteTeam || '';
    let metric = 'scr';
    const AT = A(D.analysis.teams), AB = A(D.analysis.bowlers), NT = AT.length;
    const projRank = {};
    AT.map(t=>({id:t.teamId,p:(t.pace&&t.pace.projectedTotal)||0})).sort((a,b)=>b.p-a.p)
      .forEach((r,i)=>projRank[r.id]=i+1);

    const bar = el('div',{class:'toolbar'});
    const mkM = (id,label)=>{ const b=el('button',{class:'wkbtn'+(metric===id?' active':'')}, label);
      b.onclick=()=>{ metric=id; [...bar.children].forEach(c=>c.classList.remove('active')); b.classList.add('active'); renderAll(); };
      return b; };
    bar.append(el('span',{class:'muted',style:'align-self:center'},'Metric:'), mkM('scr','Scratch'), mkM('hcp','Handicap'));
    v.append(bar);

    const teams = D.trends.teams.slice().sort((a,b)=>a.name.localeCompare(b.name));
    const pT = el('div',{class:'panel'}); pT.append(el('h2',{},'Team analysis'));
    const tSel = mkSelect(teams.map(t=>t.name));
    if(fav && teams.some(t=>t.name===fav)) tSel.value = fav;
    pT.append(el('div',{class:'toolbar'}, tSel));
    const tHost = el('div'); pT.append(tHost); v.append(pT);

    const bwls = D.trends.bowlers.slice().sort((a,b)=>a.name.localeCompare(b.name));
    const pB = el('div',{class:'panel'}); pB.append(el('h2',{},'Bowler analysis'));
    const bSel = mkSelect(bwls.map(b=>({label:b.name+'  ('+b.team+')', value:b.id})));
    if(fav){ const fb = bwls.find(b=>b.team===fav); if(fb) bSel.value = fb.id; }
    pB.append(el('div',{class:'toolbar'}, bSel));
    const bHost = el('div'); pB.append(bHost); v.append(pB);

    function seriesBlock(host, t){
      const weeks = A(t.weeks);
      host.append(el('h3',{style:'margin:14px 12px 2px'},'Series by week'));
      if(!weeks.length){ host.append(el('div',{class:'muted',style:'padding:6px 14px'},'no weeks bowled yet')); return; }
      const parts = [`season avg ${num(t.seasonAvg)}`];
      if(t.best)  parts.push(`best ${t.best.date.slice(5)} ${signed(t.best.vsSeason)}`);
      if(t.worst && (!t.best || t.worst.date!==t.best.date)) parts.push(`worst ${t.worst.date.slice(5)} ${signed(t.worst.vsSeason)}`);
      if(t.stdev!=null) parts.push(`consistency σ ${t.stdev}`);
      host.append(el('div',{class:'summary'}, parts.join('   ·   ')));
      host.append(trendChart(weeks, t.seasonAvg));
      host.append(el('div',{class:'muted',style:'padding:0 14px 6px;font-size:11px'},
        'Green above the season average, red below. Blue line = running average (“form”). Faint = partial weeks.'));
      host.append(trendTable(weeks));
    }

    function paceBlock(host, pace, isTeam, teamId){
      if(!pace || !A(pace.rows).length) return;
      host.append(el('h3',{style:'margin:16px 12px 2px'}, isTeam?'Points pace':'Your points pace'));
      const bits = [`${signed(pace.currentVsEven)} vs the even line`];
      if(isTeam && pace.projectedTotal!=null)
        bits.push(`projected ${num(pace.projectedTotal)} over ${pace.seasonWeeks} weeks` + (projRank[teamId]?` — would rank ${projRank[teamId]} / ${NT}`:''));
      host.append(el('div',{class:'summary'}, bits.join('   ·   ')));
      host.append(lineChart(A(pace.rows), {key:'cum',label:'points'}, {key:'even',label:'even'}));
      host.append(el('div',{class:'muted',style:'padding:0 14px 6px;font-size:11px'},
        'Solid = cumulative points. Dashed = the even line ('+(isTeam?(D.meta.pointsPerWeek/2):2.5)+'/week).'));
    }

    function cardsFor(host, an, isTeam){
      const g = el('div',{class:'grid'});
      // position rounds
      if(an.positionRounds && an.positionRounds.enabled){
        const pr = an.positionRounds;
        const rows = [['Avg points', pr.posAvgPts, pr.regAvgPts], ['Avg series', pr.posAvgSer, pr.regAvgSer]];
        if(isTeam) rows.push(['Record', pr.posRecord, pr.regRecord]);
        const pw = A(D.analysis.positionRoundWeeks).join(', ');
        g.append(stat('Position rounds vs regular',
          kv([['', el('b',{},'Position'), el('b',{},'Regular')], ...rows]),
          el('div',{class:'muted',style:'font-size:11px;margin-top:4px'},
            `${pr.posWeeks} position / ${pr.regWeeks} regular weeks bowled` + (pw?` · position weeks: ${pw}`:''))));
      }
      // anchor (team only)
      if(isTeam && an.anchor){
        const mx = Math.max(...an.anchor.map(a=>a.avgPts||0), 0.1);
        const rows = an.anchor.map(a=> el('div',{class:'anchorrow'},
          el('span',{class:'ap'}, 'Pos '+a.pos),
          el('span',{class:'barbg',style:'flex:1'}, el('i',{style:`width:${Math.round((a.avgPts||0)/mx*100)}%`})),
          el('span',{class:'av'}, a.avgPts==null?'—':a.avgPts)));
        g.append(stat('Points by lineup position',
          ...rows, el('div',{class:'muted',style:'font-size:11px;margin-top:4px'},'avg individual points earned per week, this season')));
      }
      // handicap trend
      if(an.handicap){
        const h = an.handicap;
        g.append(stat('Handicap trend',
          el('div',{}, (h.first==null?'—':h.first)+' → '+(h.last==null?'—':h.last)+'  ', delta(h.delta)),
          el('div',{style:'margin-top:4px'}, spark(h.byWeek,'hdcp')),
          el('div',{class:'muted',style:'font-size:11px;margin-top:4px'}, h.delta<0?'handicap falling — average rising':(h.delta>0?'handicap rising — average slipping':'flat'))));
      }
      // clutch (team only)
      if(isTeam && an.clutch){
        const c = an.clutch;
        const body = [el('div',{}, `${c.wins}–${c.losses} in matchups decided by ≤ 4 points`)];
        A(c.list).forEach(x=> body.push(el('div',{class:'muted',style:'font-size:12px'},
          `${x.date.slice(5)} vs ${x.opp} — ${x.won?'won':'lost'} by ${Math.abs(x.margin)}`)));
        if(!A(c.list).length) body.push(el('div',{class:'muted',style:'font-size:11px'},'no close matchups yet'));
        g.append(stat('Clutch', ...body));
      }
      // halves
      if(an.halves){
        const h = an.halves;
        const rows = [['Avg series', h.h1Ser, h.h2Ser]];
        if(h.h1Pts!=null || h.h2Pts!=null) rows.unshift(['Avg points', h.h1Pts, h.h2Pts]);
        g.append(stat('Season halves',
          kv([['', el('b',{},'1st half'), el('b',{},'2nd half')], ...rows]),
          el('div',{class:'muted',style:'font-size:11px;margin-top:4px'}, `weeks 1–${D.analysis.halfWeek} vs ${D.analysis.halfWeek+1}–${D.analysis.seasonWeeks}`)));
      }
      // streaks
      if(an.streaks){
        const s = an.streaks, body=[];
        body.push(el('div',{}, `Above season avg series — longest ${s.aboveSeason.longest}, current ${s.aboveSeason.current}`));
        if(s.matchupWins) body.push(el('div',{}, `Matchup wins — longest ${s.matchupWins.longest}, current ${s.matchupWins.current}`));
        g.append(stat('Streaks', ...body));
      }
      host.append(g);
    }

    function drawTeam(){
      tHost.innerHTML='';
      const tr = teams.find(t=>t.name===tSel.value);
      if(!tr){ tHost.append(el('div',{class:'muted',style:'padding:12px'},'no data')); return; }
      const an = AT.find(a=>a.teamId===tr.teamId);
      seriesBlock(tHost, tr[metric]);
      pointsWeekBlock(tHost, tr.teamId);
      placementBlock(tHost, tr.teamId, fav);
      if(an){ paceBlock(tHost, an.pace, true, tr.teamId); cardsFor(tHost, an, true); }
      clutchBlock(tHost, tr.teamId);
    }
    function drawBowler(){
      bHost.innerHTML='';
      const tr = bwls.find(b=>b.id===bSel.value);
      if(!tr){ bHost.append(el('div',{class:'muted',style:'padding:12px'},'no data')); return; }
      const an = AB.find(a=>a.id===tr.id);
      seriesBlock(bHost, tr[metric]);
      if(an){ paceBlock(bHost, an.pace, false); cardsFor(bHost, an, false); }
    }
    function renderAll(){ drawTeam(); drawBowler(); }
    tSel.onchange = drawTeam; bSel.onchange = drawBowler;
    renderAll();
  }
})();
</script>
</body>
</html>
