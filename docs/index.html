<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League Stats</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --ink:#1a1d21; --muted:#5b6470; --line:#e2e5ea;
    --accent:#1f6feb; --accent-soft:#e7f0fe; --good:#1a7f37; --bad:#c0392b; --bar:#c9d6e8;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1117; --panel:#161b22; --ink:#e6edf3; --muted:#8b949e; --line:#2a3038;
      --accent:#4f9dff; --accent-soft:#16324f; --good:#3fb950; --bad:#f85149; --bar:#2f3b4d;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{color:var(--accent)}
  .wrap{max-width:1120px;margin:0 auto;padding:20px 16px 80px}
  header h1{margin:0 0 2px;font-size:22px}
  header .sub{color:var(--muted);font-size:13px}
  .banner{margin:14px 0 0;padding:10px 14px;border-radius:8px;background:var(--accent-soft);
    color:var(--ink);font-size:13px;border:1px solid var(--line)}
  nav{display:flex;gap:4px;flex-wrap:wrap;margin:18px 0 16px;border-bottom:1px solid var(--line)}
  nav button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;
    padding:9px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  nav button:hover{color:var(--ink)}
  nav button.active{color:var(--accent);border-color:var(--accent)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
    padding:4px;margin-bottom:18px;overflow:hidden}
  .panel h2{font-size:14px;margin:12px 12px 4px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:right;padding:8px 10px;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;
    position:sticky;top:0;background:var(--panel);user-select:none}
  th.sortable::after{content:"\2195";opacity:.35;margin-left:4px}
  th.asc::after{content:"\2191";opacity:.9}
  th.desc::after{content:"\2193";opacity:.9}
  tbody tr{border-top:1px solid var(--line)}
  tbody tr:hover{background:var(--accent-soft)}
  td.num{font-variant-numeric:tabular-nums}
  .pos{color:var(--good)} .neg{color:var(--bad)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px}
  .card h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .lb{list-style:none;margin:0;padding:0}
  .lb li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--line);font-size:14px}
  .lb li:first-child{border-top:0}
  .lb .r{color:var(--muted);width:1.6em;display:inline-block;text-align:right;font-variant-numeric:tabular-nums}
  .lb .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
  .lb .tm{color:var(--muted);font-size:12px}
  .lb .v{font-weight:700;font-variant-numeric:tabular-nums}
  .toolbar{display:flex;gap:10px;align-items:center;margin:0 12px 8px;flex-wrap:wrap}
  input[type=search]{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;
    background:var(--bg);color:var(--ink);font:inherit}
  .bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle}
  .barbg{display:inline-block;width:120px;height:8px;border-radius:4px;background:var(--bar);vertical-align:middle;overflow:hidden}
  .barbg > i{display:block;height:100%;background:var(--accent)}
  tr.detail td{background:var(--bg);padding:0}
  .weeks{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px}
  .wk{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--panel)}
  .wk b{font-variant-numeric:tabular-nums}
  .wk .d{color:var(--muted);font-size:11px}
  .muted{color:var(--muted)}
  footer{margin-top:30px;color:var(--muted);font-size:12px;text-align:center}
  /* head-to-head */
  select{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;max-width:240px}
  .wkbtn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer}
  .wkbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .summary{padding:10px 14px;font-weight:700}
  .matchcard{border:1px solid var(--line);border-radius:10px;margin:10px 12px;overflow:hidden;background:var(--panel)}
  .mc-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
  .mc-side{flex:1;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;border-radius:8px}
  .mc-side.win{background:var(--accent-soft)}
  .mc-side.fav .mc-team{text-decoration:underline}
  .mc-side:last-child{flex-direction:row-reverse}
  .mc-team{font-weight:600}
  .mc-pts{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .mc-vs{color:var(--muted);font-size:12px}
  .mc-meta{padding:0 14px 10px;font-size:12px}
  .mc-pairs{border-top:1px solid var(--line);padding:6px 0;background:var(--bg)}
  .pair{display:grid;grid-template-columns:1fr auto auto 1.4em auto auto 1fr;gap:8px;align-items:center;padding:4px 14px;font-size:13px}
  .pair .pn{font-weight:600}
  .pair .pn.r{text-align:right}
  .pair .pg{color:var(--muted);font-variant-numeric:tabular-nums}
  .pair .pp{font-weight:700;font-variant-numeric:tabular-nums}
  .pair .pvs{color:var(--muted);text-align:center}
  .review{border-color:var(--bad)}
  .review h2{color:var(--bad)}
  .rv-date{font-weight:700;font-size:13px;padding:10px 14px 2px;font-variant-numeric:tabular-nums}
  .rv-team{padding:4px 14px 8px;font-size:13px}
  .rv-flag{color:var(--muted);padding-left:10px}
  .mc-flags{padding:6px 14px;font-size:12px;color:var(--bad)}
  .ktag{display:inline-block;margin:0 4px;padding:0 5px;border-radius:4px;font-size:10px;font-weight:700;
    text-transform:uppercase;vertical-align:middle;background:var(--bar);color:var(--muted)}
  .ktag.blind{background:#8a5a00;color:#fff}
  .ktag.sub{background:var(--accent);color:#fff}
  .ktag.part{background:#7a4bb5;color:#fff}
  @media (max-width:640px){ th,td{padding:7px 6px} .hide-sm{display:none}
    .pair{grid-template-columns:1fr auto 1.4em auto 1fr} .pair .pg{display:none} }
</style>
</head>

      th._k = c.k; tr.append(th);
    });
    thead.append(tr); t.append(thead);
    const tb = el('tbody'); t.append(tb);
    function render(){
      [...tr.children].forEach(th=>{ th.classList.remove('asc','desc');
        if(th._k===sortK) th.classList.add(sortDir>0?'asc':'desc'); });
      const sorted = rows.slice().sort((a,b)=>{
        let x=a[sortK], y=b[sortK];
        if(x==null) x=-Infinity; if(y==null) y=-Infinity;
        if(typeof x==='string'||typeof y==='string') return (''+x).localeCompare(''+y)*sortDir;
        return (x-y)*sortDir;
      });
      tb.innerHTML='';
      sorted.forEach(r=>{
        const row = el('tr');
        cols.forEach(c=>{
          const raw = r[c.k];
          const cell = c.fmt ? c.fmt(raw,r) : (raw==null?'':raw);
          const td = el('td',{class:(c.cls||'')}, cell && cell.nodeType ? cell : (''+ (cell==null?'':cell)) );
          row.append(td);
        });
        tb.append(row);
        if(opts.expand){
          row.style.cursor='pointer';
          row.onclick = ()=>{
            const nx = row.nextSibling;
            if(nx && nx.classList && nx.classList.contains('detail')){ nx.remove(); return; }
            const dr = el('tr',{class:'detail'}); const dtd = el('td',{colspan:cols.length});
            dtd.append(opts.expand(r)); dr.append(dtd); row.after(dr);
          };
        }
      });
    }
    render();
    return t;
  }

  function viewStandings(v){
    const p = el('div',{class:'panel'});
    p.append(table([
      {k:'rank',label:'#',cls:'num',def:1},
      {k:'name',label:'Team'},
      {k:'record',label:'W-L-T',fmt:(_,r)=>`${r.wins}-${r.losses}-${r.ties}`},
      {k:'pointsWon',label:'Pts Won',cls:'num',fmt:num},
      {k:'pointsLost',label:'Pts Lost',cls:'num',fmt:num},
      {k:'pctWon',label:'Pts %',cls:'num',fmt:x=>x==null?'':x.toFixed(1)},
      {k:'teamAvg',label:'Team Avg',cls:'num hide-sm',fmt:num},
      {k:'teamHdcp',label:'Team Hdcp',cls:'num hide-sm',fmt:num},
    ], D.standings, {sort:'rank',dir:1,expand:r=>{
      const d = el('div',{class:'weeks'});
      d.append(el('div',{class:'wk'}, el('span',{class:'d'},'Roster'), el('br'), A(r.roster).join(', ')));
      return d;
    }}));
    v.append(p);
  }

  function lbCard(title, list, fmt){
    const c = el('div',{class:'card'}, el('h3',{},title));
    const ul = el('ul',{class:'lb'});
    const items = A(list);
    items.forEach((it,i)=>{
      ul.append(el('li',{},
        el('span',{class:'r'}, (i+1)+''),
        el('span',{class:'nm'}, it.name, it.team? el('span',{class:'tm'},'  '+it.team):null),
        el('span',{class:'v'}, fmt?fmt(it.value):num(it.value))
      ));
    });
    if(!items.length) ul.append(el('li',{class:'muted'},'— no data yet —'));
    c.append(ul); return c;
  }

  function viewLeaders(v){
    const g = el('div',{class:'grid'});
    const L = D.leaderboards, T = D.teamLeaderboards;
    g.append(lbCard('High Game (scratch)', L.highGame));
    g.append(lbCard('High Series (scratch)', L.highSeries));
    g.append(lbCard('High Game (handicap)', L.highGameHdcp));
    g.append(lbCard('High Series (handicap)', L.highSeriesHdcp));
    g.append(lbCard('Top Average (this season)', L.topSeasonAvg, x=>x==null?'':x.toFixed(1)));
    g.append(lbCard('Top Average (book)', L.topBookAvg));
    g.append(lbCard('Most Improved', L.mostImproved, signed));
    g.append(lbCard('Biggest Drop', L.mostDeclined, signed));
    g.append(lbCard(A(L.indPoints).length ? 'Individual Points' : 'Individual Points (computed)',
                    A(L.indPoints).length ? L.indPoints : L.indPointsComp));
    g.append(lbCard('Team High Game (scratch)', T.teamGame));
    g.append(lbCard('Team High Series (scratch)', T.teamSeries));
    g.append(lbCard('Team High Game (handicap)', T.teamGameHdcp));
    g.append(lbCard('Team High Series (handicap)', T.teamSeriesHdcp));
    g.append(lbCard('Team Points', T.teamPoints));
    v.append(g);
  }

  function viewAverages(v){
    const p = el('div',{class:'panel'});
    const max = Math.max(...D.bowlers.map(b=>b.bookAvg||0), 1);
    p.append(table([
      {k:'name',label:'Bowler'},
      {k:'team',label:'Team',cls:'hide-sm'},
      {k:'bookAvg',label:'Book',cls:'num',fmt:(x)=>{
        const w = Math.round((x/max)*120);
        return el('span',{}, x+' ', el('span',{class:'barbg'}, el('i',{style:`width:${w}px`})));
      }},
      {k:'seasonAvg',label:'Season',cls:'num',fmt:x=>x==null?'':x.toFixed(1)},
      {k:'improve',label:'+/-',cls:'num',fmt:(x)=> x==null?'': el('span',{class:x>0?'pos':(x<0?'neg':'')}, signed(x))},
      {k:'gamesBowled',label:'Gm',cls:'num'},
      {k:'hdcp',label:'Hdcp',cls:'num hide-sm'},
    ], D.bowlers, {sort:'bookAvg'}));
    v.append(p);
  }

  function viewBowlers(v){
    const p = el('div',{class:'panel'});
    const tb = el('div',{class:'toolbar'});
    const search = el('input',{type:'search',placeholder:'Filter bowlers or teams…'});
    tb.append(search); p.append(tb);
    const host = el('div'); p.append(host);
    function draw(q){
      host.innerHTML='';
      const rows = D.bowlers.filter(b=> !q ||
        b.name.toLowerCase().includes(q) || b.team.toLowerCase().includes(q));
      host.append(table([
        {k:'name',label:'Bowler'},
        {k:'team',label:'Team',cls:'hide-sm'},
        {k:'bookAvg',label:'Avg',cls:'num'},
        {k:'gamesBowled',label:'Gm',cls:'num'},
        {k:'highGame',label:'Hi Gm',cls:'num'},
        {k:'highSeries',label:'Hi Ser',cls:'num'},
        {k:'highGameHdcp',label:'Hi Gm+H',cls:'num hide-sm'},
        {k:'highSeriesHdcp',label:'Hi Ser+H',cls:'num hide-sm'},
        {k:'stdev',label:'σ',cls:'num hide-sm',fmt:x=>x==null?'':x},
        {k:'indPoints',label:'Pts',cls:'num',fmt:(x,r)=> x>0 ? num(x)
            : (r.compIndPoints>0 ? el('span',{class:'muted'}, num(r.compIndPoints)+'*') : '')},
      ], rows, {sort:'bookAvg', expand:r=>{
        const d = el('div',{class:'weeks'});
        const wks = A(r.weeks);
        wks.forEach(w=>{
          d.append(el('div',{class:'wk'},
            el('span',{class:'d'}, w.date + (w.isMatch?' • counts':'') + (w.partial?' • partial':'')), el('br'),
            w.absent ? el('span',{class:'muted'},'absent')
                     : el('b',{}, A(w.games).map(x=>x==null?'–':x).join('  ') + '   = ' + w.scrSer)
          ));
        });
        if(!wks.length) d.append(el('span',{class:'muted'},'no games'));
        return d;
      }}));
      if(D.bowlers.some(b=>b.indPoints===0 && b.compIndPoints>0))
        host.append(el('div',{class:'muted',style:'padding:6px 12px;font-size:12px'},
          '* computed individual points (LeaguePals hasn’t posted official points yet); excludes points won as a blind.'));
    }
    draw('');
    search.oninput = ()=>draw(search.value.trim().toLowerCase());
    v.append(p);
  }

  function viewTeams(v){
    const g = el('div',{class:'grid'});
    D.standings.forEach(t=>{
      const c = el('div',{class:'card'});
      c.append(el('h3',{}, '#'+t.rank+'  '+t.name));
      c.append(el('div',{class:'muted',html:
        `${t.wins}-${t.losses}-${t.ties} &nbsp;•&nbsp; ${num(t.pointsWon)} pts (${t.pctWon.toFixed(1)}%) `
        +`&nbsp;•&nbsp; team avg ${num(t.teamAvg)}`}));
      const ul = el('ul',{class:'lb'});
      A(t.roster).forEach(nm=>{
        const b = D.bowlers.find(x=>x.name===nm && x.team===t.name) || {};
        ul.append(el('li',{},
          el('span',{class:'nm'}, nm),
          el('span',{class:'v'}, b.bookAvg!=null?b.bookAvg:'')
        ));
      });
      c.append(ul);
      g.append(c);
    });
    v.append(g);
  }

  // ================= Head-to-Head =================
  function mkSelect(items){
    const s = el('select');
    items.forEach(it=>{
      const o = el('option');
      if(typeof it==='string'){ o.value=it; o.textContent=it; }
      else { o.value=it.value; o.textContent=it.label; }
      s.append(o);
    });
    return s;
  }

  function matchCard(m, fav){
    const c = el('div',{class:'matchcard'});
    const mkSide = (s,key)=>{
      const isWin = m.result===key;
      return el('div',{class:'mc-side'+(isWin?' win':'')+(fav&&s.team===fav?' fav':'')},
        el('div',{class:'mc-team'}, s.team),
        el('div',{class:'mc-pts'}, num(s.total)));
    };
    const head = el('div',{class:'mc-head'},
      mkSide(m.a,'A'),
      el('div',{class:'mc-vs'}, m.needsReview?'⚠':(m.result==='T'?'tie':'vs')),
      mkSide(m.b,'B'));
    const meta = el('div',{class:'mc-meta muted'},
      `scratch series ${m.a.ser}–${m.b.ser}   ·   hcp series ${m.a.serH}–${m.b.serH}`
      + `   ·   team pts ${num(m.a.teamPts)}–${num(m.b.teamPts)}   ·   indiv pts ${num(m.a.indPts)}–${num(m.b.indPts)}`
      + (m.estimated?'   ·   estimated (short lineup / missing games)':'')
      + (m.counts?'':'   ·   practice week'));
    const det = el('div',{class:'mc-pairs'}); det.hidden = true;
    const kindTag = k => k==='blind' ? el('span',{class:'ktag blind'},'blind')
                       : k==='sub' ? el('span',{class:'ktag sub'},'sub')
                       : k==='partial' ? el('span',{class:'ktag part'},'part') : null;
    const gtxt = g => A(g).map(x=>x==null?'–':x).join(' ');
    A(m.pairs).forEach(p=>{
      det.append(el('div',{class:'pair'},
        el('span',{class:'pn'}, p.aName, kindTag(p.aKind)),
        el('span',{class:'pg'}, gtxt(p.aGames)),
        el('span',{class:'pp'}, num(p.aPts)),
        el('span',{class:'pvs'}, '–'),
        el('span',{class:'pp'}, num(p.bPts)),
        el('span',{class:'pg'}, gtxt(p.bGames)),
        el('span',{class:'pn r'}, kindTag(p.bKind), p.bName)
      ));
    });
    if(m.needsReview && A(m.flags).length){
      const fl = el('div',{class:'mc-flags'});
      A(m.flags).forEach(f=> fl.append(el('div',{}, '⚠ '+f)));
      det.append(fl);
    }
    if(!A(m.pairs).length) det.append(el('div',{class:'muted',style:'padding:4px 14px'},'no lineup detail'));
    head.onclick = ()=>{ det.hidden = !det.hidden; };
    c.append(head, meta, det);
    return c;
  }

  function viewH2H(v){
    const weeks = [...new Set(D.schedule.map(m=>m.date))].sort();
    const fav = D.meta.favoriteTeam || '';
    const favFirst = arr => fav ? arr.slice().sort((a,b)=>
      ((a.a.team===fav||a.b.team===fav)?0:1) - ((b.a.team===fav||b.b.team===fav)?0:1)) : arr;

    // --- needs review ---
    const reviews = A(D.reviews).filter(r=>!r.resolved);
    if(reviews.length){
      const p0 = el('div',{class:'panel review'});
      p0.append(el('h2',{}, `Needs Review — ${reviews.length} lineup${reviews.length>1?'s':''}`));
      p0.append(el('div',{class:'muted',style:'padding:2px 14px 8px;font-size:12px'},
        'Subs, blinds and missed games below were auto-guessed. Edit the matching '
        + 'data\\lineups\\<date>.json file, set that team’s "resolved": true, and re-run Build-Stats.ps1.'));
      const byDate = {};
      reviews.forEach(r=>{ (byDate[r.date]=byDate[r.date]||[]).push(r); });
      Object.keys(byDate).sort().forEach(d=>{
        p0.append(el('div',{class:'rv-date'}, d + '   (data\\lineups\\'+d+'.json)'));
        byDate[d].forEach(r=>{
          const box = el('div',{class:'rv-team'});
          box.append(el('b',{}, r.team));
          A(r.flags).forEach(f=> box.append(el('div',{class:'rv-flag'}, '• '+f)));
          p0.append(box);
        });
      });
      v.append(p0);
    }

    // --- schedule & results ---
    const p1 = el('div',{class:'panel'});
    p1.append(el('h2',{},'Schedule & Results'));
    if(!D.schedule.length){
      p1.append(el('div',{class:'muted',style:'padding:12px'},'No matchups reconstructed yet.'));
    } else {
      const bar = el('div',{class:'toolbar'});
      const host = el('div');
      let cur = weeks[weeks.length-1];
      const drawWk = ()=>{ host.innerHTML='';
        favFirst(D.schedule.filter(m=>m.date===cur)).forEach(m=>host.append(matchCard(m, fav))); };
      weeks.forEach(w=>{
        const b = el('button',{class:'wkbtn'+(w===cur?' active':'')}, w);
        b.onclick = ()=>{ cur=w; [...bar.children].forEach(x=>x.classList.remove('active')); b.classList.add('active'); drawWk(); };
        bar.append(b);
      });
      p1.append(bar, host); drawWk();
    }
    v.append(p1);

    // --- team vs team ---
    const teamNames = D.standings.map(t=>t.name).sort();
    const p2 = el('div',{class:'panel'});
    p2.append(el('h2',{},'Team vs Team'));
    const tb2 = el('div',{class:'toolbar'});
    const a2 = mkSelect(teamNames), b2 = mkSelect(teamNames);
    if(teamNames.length>1) b2.selectedIndex = 1;
    if(fav && teamNames.includes(fav)){ a2.value = fav; if(b2.value===fav) b2.selectedIndex = (teamNames[0]===fav?1:0); }
    tb2.append(a2, el('span',{class:'muted'},'vs'), b2);
    const h2 = el('div'); p2.append(tb2, h2);
    const drawTeam = ()=>{
      h2.innerHTML='';
      const A1=a2.value, B1=b2.value;
      if(A1===B1){ h2.append(el('div',{class:'muted',style:'padding:12px'},'Pick two different teams.')); return; }
      const ms = D.schedule.filter(m=>(m.a.team===A1&&m.b.team===B1)||(m.a.team===B1&&m.b.team===A1))
                           .sort((x,y)=>x.date<y.date?-1:1);
      if(!ms.length){ h2.append(el('div',{class:'muted',style:'padding:12px'}, A1+' and '+B1+' haven’t met yet.')); return; }
      let aP=0,bP=0,aW=0,bW=0,ti=0;
      ms.forEach(m=>{ const [x,y]= m.a.team===A1?[m.a,m.b]:[m.b,m.a];
        aP+=x.total; bP+=y.total;
        if(x.total>y.total)aW++; else if(y.total>x.total)bW++; else ti++; });
      h2.append(el('div',{class:'summary'},
        `${A1}  ${aW}–${bW}${ti?'–'+ti:''}  ${B1}`,
        el('br'),
        el('span',{class:'muted'}, `points ${num(aP)} – ${num(bP)} across ${ms.length} meeting${ms.length>1?'s':''}`)));
      ms.forEach(m=>h2.append(matchCard(m, A1)));
    };
    a2.onchange=drawTeam; b2.onchange=drawTeam; drawTeam();
    v.append(p2);

    // --- bowler vs bowler ---
    const bl = D.bowlers.slice().sort((x,y)=>x.name.localeCompare(y.name))
                        .map(b=>({label:b.name+'  ('+b.team+')', value:b.id}));
    const p3 = el('div',{class:'panel'});
    p3.append(el('h2',{},'Bowler vs Bowler'));
    p3.append(el('div',{class:'muted',style:'padding:0 14px 6px;font-size:12px'},
      'Individual matchups are inferred from lineup position (LeaguePals doesn’t publish the pairings).'));
    const tb3 = el('div',{class:'toolbar'});
    const a3 = mkSelect(bl), b3 = mkSelect(bl);
    if(bl.length>1) b3.selectedIndex = 1;
    if(fav){
      const favB = D.bowlers.find(b=>b.team===fav);
      if(favB){ a3.value = favB.id; if(b3.value===favB.id) b3.selectedIndex = (bl[0].value===favB.id?1:0); }
    }
    tb3.append(a3, el('span',{class:'muted'},'vs'), b3);
    const h3 = el('div'); p3.append(tb3, h3);
    const drawBowler = ()=>{
      h3.innerHTML='';
      const A1=a3.value, B1=b3.value;
      if(A1===B1){ h3.append(el('div',{class:'muted',style:'padding:12px'},'Pick two different bowlers.')); return; }
      const rows=[];
      D.schedule.forEach(m=>{
        A(m.pairs).forEach(pr=>{
          const hit = (pr.aId===A1&&pr.bId===B1)||(pr.aId===B1&&pr.bId===A1);
          if(!hit) return;
          const flip = pr.aId===B1;
          const gj = g => A(g).map(x=>x==null?'–':x).join(' ');
          const X = flip?{g:pr.bGames,s:pr.bSer,h:pr.bHdcp,p:pr.bPts,k:pr.bKind}:{g:pr.aGames,s:pr.aSer,h:pr.aHdcp,p:pr.aPts,k:pr.aKind};
          const Y = flip?{g:pr.aGames,s:pr.aSer,h:pr.aHdcp,p:pr.aPts,k:pr.aKind}:{g:pr.bGames,s:pr.bSer,h:pr.bHdcp,p:pr.bPts,k:pr.bKind};
          rows.push({date:m.date, teams:m.a.team+' v '+m.b.team,
            aLine:gj(X.g)+'  ('+X.s+' +'+X.h+')'+(X.k&&X.k!=='bowler'?' ['+X.k+']':''), aPts:X.p,
            bLine:gj(Y.g)+'  ('+Y.s+' +'+Y.h+')'+(Y.k&&Y.k!=='bowler'?' ['+Y.k+']':''), bPts:Y.p});
        });
      });
      const nA = (bl.find(x=>x.value===A1)||{}).label||'', nB = (bl.find(x=>x.value===B1)||{}).label||'';
      if(!rows.length){ h3.append(el('div',{class:'muted',style:'padding:12px'},
        nA.split('  (')[0]+' and '+nB.split('  (')[0]+' haven’t been in the same matchup (by position) yet.')); return; }
      let aP=0,bP=0; rows.forEach(r=>{aP+=r.aPts;bP+=r.bPts});
      h3.append(el('div',{class:'summary'},
        `${nA.split('  (')[0]}  ${num(aP)} – ${num(bP)}  ${nB.split('  (')[0]}`,
        el('br'), el('span',{class:'muted'}, `${rows.length} head-to-head week${rows.length>1?'s':''}`)));
      h3.append(table([
        {k:'date',label:'Week'},
        {k:'aLine',label:nA.split('  (')[0]},
        {k:'aPts',label:'Pts',cls:'num',fmt:num},
        {k:'bPts',label:'Pts',cls:'num',fmt:num},
        {k:'bLine',label:nB.split('  (')[0]},
      ], rows, {sort:'date',dir:1}));
    };
    a3.onchange=drawBowler; b3.onchange=drawBowler; drawBowler();
    v.append(p3);
  }
})();
</script>
